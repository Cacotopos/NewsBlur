<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folder icon menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 16px;border:none;border-top:1px solid #e3e3df;background:#ffffff;font:500 15px/1.2 system-ui,-apple-system,sans-serif;color:#1f1f1c;text-align:left;box-sizing:border-box;cursor:pointer}
</style>
</helmet>
<div style="width: 520px; height: 440px; box-sizing: border-box; padding: 40px; background: #e8e8e4; font-family: system-ui, -apple-system, sans-serif; display: flex; gap: 24px; align-items: flex-start">
<div style="display: flex; flex-direction: column; align-items: center; gap: 7px; width: 96px">
<div style="width: 64px; height: 64px; border-radius: 20px; background: #33332f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">Wr</div>
<span style="font-size: 12px; font-weight: 500; color: #1f1f1c">Writing</span>
<span style="font-size: 11px; color: #4a4a44; text-align: center; margin-top: 10px">Long-press</span>
</div>
<div role="menu" aria-label="Folder icon" style="width: 320px; background: #ffffff; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); overflow: hidden">
<p style="margin: 0; padding: 14px 16px 10px; font-size: 13px; font-weight: 600; color: #4a4a44">Folder icon</p>
<button class="opt" role="menuitemradio" aria-checked="true">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #f4f4f1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #33332f">Wr</span>
<span style="flex: 1">Initials</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2856a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</button>
<button class="opt" role="menuitemradio" aria-checked="false">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #f4f4f1; display: flex; align-items: center; justify-content: center; color: #33332f"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></span>
<span style="flex: 1">Symbol…</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b6c64" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</button>
<button class="opt" role="menuitemradio" aria-checked="false">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #3b3b36; display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 12px; font-weight: 700">[F]</span>
<span style="flex: 1">First feed's icon</span>
</button>
<p style="margin: 0; padding: 12px 16px 14px; font-size: 12px; line-height: 1.4; color: #4a4a44; border-top: 1px solid #e3e3df">Saved per folder, on this device only.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":440}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
